# Publishes a single multi-arch container image to GHCR on every push to
# main and on every git tag. Tags written:
#
#   - latest                 (main branch only)
#   - main-sha-<short>       (main branch only)
#   - vX.Y.Z, X.Y.Z, X.Y, X  (semver tags only; metadata-action expansion)
#   - sha-<short>            (always)
#
# Watchtower follows `:latest` by default in docker-compose.yml, so a push
# to main updates the LAN host within the next poll interval (~5 min).
# Pin to a specific `vX.Y.Z` tag in docker-compose if you want predictable
# upgrades only when you cut a release.

name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  # actions:write is required by the docker buildx cache-to=type=gha
  # exporter (it writes to the Actions cache service). Missing this is
  # silent in many setups but fails the build job in others.
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On PR builds we just validate the Dockerfile — no push, no login.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR image names are lowercase. Owner is lowercased by the action.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MTG Synergy Map
            org.opencontainers.image.description=Word-map style synergy explorer and deck builder for MTG
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 covers Raspberry Pi 4/5 + Apple Silicon LAN servers;
          # amd64 covers Intel/AMD. Drop one if you only run on the other.
          # PRs build amd64 only to keep CI fast.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          # `load: true` makes docker buildx populate the daemon's image
          # store so we can inspect the result on PR builds (push: false
          # otherwise discards the image). Only safe with single-arch.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ github.event.repository.pushed_at || github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Surface BuildKit progress lines verbatim so failures are
          # easier to read in the Actions log.
          provenance: false

      - name: Print image digest
        run: |
          echo "Image: ${{ steps.meta.outputs.tags }}"
          echo "Pull with: docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest"

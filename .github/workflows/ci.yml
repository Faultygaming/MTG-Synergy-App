# Lightweight CI: typecheck, lint, and tests on every PR. Keeps the
# release workflow (which builds + pushes images) fast by running
# correctness checks here instead.
#
# Only runs on PRs. Re-running on main after merge is redundant — the
# code that gets merged was already CI'd on the PR branch (squash merge
# preserves the same diff), so the post-merge run would be the same
# checks against the same code. release.yml handles main-branch Docker
# builds. `workflow_dispatch` is kept as a manual safety net.

name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      # `pnpm validate` bundles lint + typecheck + test + build + the
      # maintenance-script smoke tests (against a temp SQLite DB).
      # Single source of truth for "is this branch green" — devs run the
      # same command locally before pushing.
      - run: pnpm validate
